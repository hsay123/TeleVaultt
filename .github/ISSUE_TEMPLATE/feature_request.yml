name: Feature request
description: Suggest an improvement, a new section or a new capability.
title: 'feat: '
labels: ['enhancement', 'needs triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. For anything larger than a small change, open this issue
        first so the approach can be agreed before code is written.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation today and why it is a problem. Avoid jumping straight to a solution.
      placeholder: When I land on the page from a phone, I cannot tell...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you ruled them out.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Landing page
        - Contributor guide
        - Accessibility
        - Performance
        - Design system / tokens
        - Documentation
        - Build, CI or tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, references or links that would help.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for this idea.
          required: true
        - label: I am willing to open a pull request for this if the approach is agreed.
          required: false
